name: kanban

on:
  push:
    branches: [main]
    paths:
      - "kanban/**"
      - ".github/workflows/kanban.yml"
  pull_request:
    paths:
      - "kanban/**"
      - ".github/workflows/kanban.yml"

defaults:
  run:
    working-directory: kanban

permissions:
  contents: read

jobs:
  lint:
    if: false # temporarily disabled
    name: Lint (RSLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: meteorengineer/setup-meteor@ea0fcbe01845a4b8b0862301b46e761272378b93 # v2
      - run: meteor npm install
      - run: npm run lint

  test:
    name: Test (Mocha)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: meteorengineer/setup-meteor@ea0fcbe01845a4b8b0862301b46e761272378b93 # v2
      - run: meteor npm install
      - run: npm run test:headless

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: meteorengineer/setup-meteor@ea0fcbe01845a4b8b0862301b46e761272378b93 # v2
      - run: meteor npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:headless
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kanban-test-results
          path: kanban/test-results/
          retention-days: 7

<head>
  <title>Civic Snap</title>
  <meta
    name="description"
    content="Capture and route neighborhood issue reports with photos and native mobile tools."
  />
  <meta name="theme-color" content="#0f756b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/app-icon.svg" sizes="any" type="image/svg+xml" />
  <script>
    document
      .querySelectorAll('link[rel="stylesheet"][href^="/app/build-chunks/"]')
      .forEach((stylesheet) => {
        stylesheet.href = stylesheet.getAttribute('href').replace(
          '/app/build-chunks/',
          '/build-chunks/'
        );
      });
  </script>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
</head>

<body>
  <div id="react-target"></div>
</body>

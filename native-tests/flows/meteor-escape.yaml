appId: com.meteor.examples.meteorescape
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Meteor Escape"
    timeout: 120000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "New app update available"
          commands:
            - tapOn: "Not now"
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "Quick Mission"
- extendedWaitUntil:
    visible: "Mission control"
    timeout: 60000
- assertVisible: "Meteor"
- tapOn: "Shield"
- extendedWaitUntil:
    visible: "Warp charged"
    timeout: 30000
- assertVisible: "Rematch"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Quick Mission"
    timeout: 10000
- tapOn: "System"
- extendedWaitUntil:
    visible: "System information"
    timeout: 60000
- extendedWaitUntil:
    visible: "Native ready"
    timeout: 60000
- extendedWaitUntil:
    visible: "DDP connected"
    timeout: 60000
- assertVisible: "Meteor.isCapacitor true"
- runFlow:
    when:
      visible: "Update ready"
    commands:
      - tapOn: "Review update"
- runFlow:
    when:
      notVisible: "New app update available"
    commands:
      - scrollUntilVisible:
          element:
            text: "Preview HCP update"
          direction: DOWN
          timeout: 10000
      - tapOn: "Preview HCP update"
- assertVisible: "New app update available"
- assertVisible: "Install update"
- tapOn: "Not now"
- assertVisible: "Update ready"
- tapOn: "Review update"
- assertVisible: "New app update available"
- tapOn: "Not now"
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Quick Mission"
    timeout: 10000

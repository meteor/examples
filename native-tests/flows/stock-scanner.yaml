appId: com.meteor.examples.stockscanner
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Stock Scanner"
    timeout: 60000
- tapOn: "Open navigation"
- tapOn: "System information"
- extendedWaitUntil:
    visible: "Native ready"
    timeout: 60000
- extendedWaitUntil:
    visible: "DDP connected"
    timeout: 60000
- assertVisible: "Meteor.isCapacitor true"
- scrollUntilVisible:
    element:
      text: "Preview HCP update"
    direction: DOWN
    timeout: 10000
- tapOn: "Preview HCP update"
- assertVisible: "New app update available"
- assertVisible: "Install update"
- tapOn: "Not now"
- tapOn: "Open navigation"
- tapOn: "Inventory"
- tapOn: "Manual SKU"
- inputText: "SKU-NATIVE-1"
- hideKeyboard
- tapOn: "Add manual SKU"
- extendedWaitUntil:
    visible: "Open SKU-NATIVE-1"
    timeout: 10000
- tapOn: "Show low stock"
- extendedWaitUntil:
    visible: "Open SKU-NATIVE-1"
    timeout: 10000

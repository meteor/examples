appId: com.meteor.examples.meteorescape
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Meteor Escape"
    timeout: 60000
- extendedWaitUntil:
    visible: "Quick Mission"
    timeout: 60000
- startRecording:
    path: ${SHOWCASE_VIDEO_PATH}
    label: "Meteor Escape solo mission showcase"
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 3000
- tapOn: "Quick Mission"
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1500
- tapOn: "Shield"
- extendedWaitUntil:
    visible: "Copilot turn"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1500
- tapOn: "Boost"
- extendedWaitUntil:
    visible: "Copilot turn"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1500
- tapOn: "Cool"
- extendedWaitUntil:
    visible: "Warp charged"
    timeout: 30000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 4000
- takeScreenshot: ${SHOWCASE_POSTER_PATH}
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Quick Mission"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 3000
- tapOn: "Records"
- extendedWaitUntil:
    visible: "Solo mission"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 4000
- stopRecording

appId: com.meteor.examples.meteordrop
---
- launchApp
- extendedWaitUntil:
    visible: "Meteor Drop"
    timeout: 60000
- runFlow:
    when:
      visible: "New app update available"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "Play vs CPU"
    timeout: 60000
- startRecording:
    path: ${SHOWCASE_VIDEO_PATH}
    label: "Meteor Drop four-in-a-row showcase"
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1800
- tapOn: "Play vs CPU"
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1200
- tapOn: "Drop meteor in column 4"
- extendedWaitUntil:
    visible: "CPU thinking"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1200
- tapOn: "Drop meteor in column 2"
- extendedWaitUntil:
    visible: "CPU thinking"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1200
- tapOn: "Drop meteor in column 3"
- extendedWaitUntil:
    visible: "CPU thinking"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your turn"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1500
- tapOn: "Drop meteor in column 1"
- extendedWaitUntil:
    visible: "Four connected!"
    timeout: 15000
- assertVisible: "You win"
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 3000
- takeScreenshot: ${SHOWCASE_POSTER_PATH}
- tapOn: "Share Result"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 2000
- tapOn:
    point: "50%,20%"
- assertNotVisible: "Copy"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Play vs CPU"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1500
- tapOn: "Records"
- extendedWaitUntil:
    visible: "Solo vs CPU"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1800
- tapOn:
    point: "17%,94%"
- tapOn: "Create Live Match"
- extendedWaitUntil:
    visible: "Waiting for rival"
    timeout: 10000
- assertVisible: "Room code"
- assertVisible: "Share Room Code"
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 2200
- tapOn: "Share Room Code"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- runScript:
    file: presentation-pause.js
    env:
      PAUSE_MS: 1800
- tapOn:
    point: "50%,20%"
- assertNotVisible: "Copy"
- tapOn: "Keep Waiting in Background"
- extendedWaitUntil:
    visible: "Open Live Room"
    timeout: 10000
- stopRecording
